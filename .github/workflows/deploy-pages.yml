name: Deploy NXTGEN to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Supabase Browser-Konfiguration erzeugen
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -n "$SUPABASE_PROJECT_REF" ] && [ -n "$SUPABASE_PUBLISHABLE_KEY" ]; then
            cat > config.js <<EOF
          window.NXTGEN_CONFIG = {
            supabaseUrl: "https://${SUPABASE_PROJECT_REF}.supabase.co",
            supabasePublishableKey: "${SUPABASE_PUBLISHABLE_KEY}"
          };
          EOF
          else
            echo "Supabase-Konfiguration fehlt; Veröffentlichung erfolgt im Demo-Modus."
          fi

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Statische App verpacken
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: NXTGEN veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
