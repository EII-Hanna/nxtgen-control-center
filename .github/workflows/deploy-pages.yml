name: Deploy NXTGEN to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Supabase Browser-Konfiguration prüfen und erzeugen
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "::error::GitHub Variable SUPABASE_PROJECT_REF fehlt."
            exit 1
          fi
          if [ -z "${SUPABASE_PUBLISHABLE_KEY:-}" ]; then
            echo "::error::GitHub Secret SUPABASE_PUBLISHABLE_KEY fehlt."
            exit 1
          fi

          cat > config.js <<EOF
          window.NXTGEN_CONFIG = {
            supabaseUrl: "https://${SUPABASE_PROJECT_REF}.supabase.co",
            supabasePublishableKey: "${SUPABASE_PUBLISHABLE_KEY}"
          };
          EOF

          grep -q "https://${SUPABASE_PROJECT_REF}.supabase.co" config.js
          grep -q "supabasePublishableKey" config.js

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Statische App verpacken
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: NXTGEN veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
