name: Deploy NXTGEN Supabase

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - '.github/workflows/deploy-supabase.yml'

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Supabase CLI installieren
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Konfiguration prüfen
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo 'SUPABASE_ACCESS_TOKEN fehlt' && exit 1)
          test -n "$SUPABASE_DB_PASSWORD" || (echo 'SUPABASE_DB_PASSWORD fehlt' && exit 1)
          test -n "$SUPABASE_PROJECT_REF" || (echo 'SUPABASE_PROJECT_REF fehlt' && exit 1)

      - name: Projekt verknüpfen
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Migrationen deployen
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Edge Functions deployen
        run: |
          if [ -d "supabase/functions/fireflies-webhook" ]; then
            supabase functions deploy fireflies-webhook --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          fi
